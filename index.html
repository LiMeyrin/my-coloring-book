<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Масштабирование изображения до 500%</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f0f2f5;
    }

    /* Контейнер для картинки с ограничением просмотра */
    .image-container {
      width: 600px;
      height: 400px;
      border: 2px solid #ccc;
      border-radius: 8px;
      overflow: hidden; /* Скрывает выходящие за пределы части */
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #fff;
      cursor: grab;
      position: relative;
    }

    .image-container:active {
      cursor: grabbing;
    }

    /* Настройки самого изображения */
    #zoomable-image {
      max-width: 100%;
      max-height: 100%;
      transition: transform 0.1s ease-out; /* Плавность масштабирования */
      transform-origin: center center;
      user-select: none;
    }

    /* Панель управления */
    .controls {
      margin-top: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    button {
      padding: 8px 16px;
      font-size: 16px;
      cursor: pointer;
      border: 1px solid #007bff;
      background-color: #007bff;
      color: white;
      border-radius: 4px;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #0056b3;
    }

    input[type="range"] {
      width: 150px;
      cursor: pointer;
    }

    .scale-value {
      font-weight: bold;
      min-width: 50px;
    }
  </style>
</head>
<body>

  <!-- Контейнер с картинкой -->
  <div class="image-container" id="container">
    <img id="zoomable-image" src="https://picsum.photos/800/600" alt="Масштабируемое изображение">
  </div>

  <!-- Элементы управления -->
  <div class="controls">
    <button id="zoom-out">-</button>
    <input type="range" id="zoom-range" min="1" max="5" step="0.1" value="1">
    <button id="zoom-in">+</button>
    <button id="zoom-reset">Сброс</button>
    <span class="scale-value" id="scale-display">100%</span>
  </div>

  <script>
    const img = document.getElementById('zoomable-image');
    const container = document.getElementById('container');
    const zoomRange = document.getElementById('zoom-range');
    const zoomInBtn = document.getElementById('zoom-in');
    const zoomOutBtn = document.getElementById('zoom-out');
    const zoomResetBtn = document.getElementById('zoom-reset');
    const scaleDisplay = document.getElementById('scale-display');

    // Границы масштаба (1 = 100%, 5 = 500%)
    const MIN_SCALE = 1;
    const MAX_SCALE = 5;
    const STEP = 0.2;

    let currentScale = 1;

    // Функция обновления масштаба
    function setScale(scale) {
      // Ограничиваем значение в диапазоне от 1 до 5
      currentScale = Math.min(Math.max(MIN_SCALE, scale), MAX_SCALE);
      
      // Применяем CSS-трансформацию
      img.style.transform = `scale(${currentScale})`;
      
      // Обновляем значение ползунка и текстовый индикатор
      zoomRange.value = currentScale;
      scaleDisplay.textContent = `${Math.round(currentScale * 100)}%`;
    }

    // 1. Увеличение по колесику мыши
    container.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = e.deltaY < 0 ? STEP : -STEP;
      setScale(currentScale + delta);
    });

    // 2. Управление ползунком
    zoomRange.addEventListener('input', (e) => {
      setScale(parseFloat(e.target.value));
    });

    // 3. Кнопки "+" и "-"
    zoomInBtn.addEventListener('click', () => setScale(currentScale + STEP));
    zoomOutBtn.addEventListener('click', () => setScale(currentScale - STEP));

    // 4. Кнопка сброса
    zoomResetBtn.addEventListener('click', () => setScale(1));
  </script>

</body>
</html>
